name: Desafio Aula01

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Digite a imagem Docker (ex.: nginx:latest)'
        required: true
        type: string

jobs:
  run-image-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar input
        run: echo "Usando imagem: ${{ github.event.inputs.docker_image }}"

      - name: Pull da imagem
        run: docker pull "${{ github.event.inputs.docker_image }}"

      - name: Verificar imagens locais (opcional)
        run: docker images